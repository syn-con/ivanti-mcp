{{- include "ivanti-mcp.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ivanti-mcp.fullname" . }}
  labels: {{- include "ivanti-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "ivanti-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the configuration changes, not only the image. With
        # secrets.existingSecret this hashes nothing the chart can see, so a key
        # rotation rolls through rolloutToken (or `kubectl rollout restart`).
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.rolloutToken }}
        ivanti-mcp/rollout-token: {{ . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "ivanti-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "ivanti-mcp.serviceAccountName" . }}
      # Mounted only to keep the licence token in its Secret, which is all the
      # account's Role allows (templates/licence-state.yaml).
      automountServiceAccountToken: {{ .Values.license.keepState }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      # The tenant hostname must resolve inside the pod.
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The projected secret inherits this, which is what makes it readable by
        # the image's own user. Root-owned secret files are the usual default and
        # surface as EACCES at startup — which reads like a missing file.
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ivanti-mcp
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            # stdio is meaningless in a pod, and loopback inside a container is the
            # container's own — neither is a choice, so neither is a value.
            - { name: STDIO_TRANSPORT_ON, value: "false" }
            - { name: HTTP_TRANSPORT_ON,  value: "true" }
            - { name: MCP_BIND,           value: "0.0.0.0" }
            - { name: MCP_PORT,           value: {{ .Values.server.port | quote }} }
            - { name: MCP_PUBLIC_URL,     value: {{ .Values.server.publicUrl | quote }} }
            - { name: TRUSTED_ORIGINS,    value: {{ join "," .Values.server.trustedOrigins | quote }} }
            - { name: AUTH_MODE,          value: {{ .Values.server.authMode | quote }} }
            - { name: MCP_MODE,           value: {{ .Values.server.mode | quote }} }
            - { name: MCP_MAX_SESSIONS,   value: {{ .Values.server.maxSessions | quote }} }
            {{- if include "ivanti-mcp.isSet" .Values.server.maxSessionsPerSubject }}
            - { name: MCP_MAX_SESSIONS_PER_SUBJECT, value: {{ .Values.server.maxSessionsPerSubject | quote }} }
            {{- end }}
            {{- if include "ivanti-mcp.isSet" .Values.server.maxCallsPerMinute }}
            - { name: MCP_MAX_CALLS_PER_MINUTE, value: {{ .Values.server.maxCallsPerMinute | quote }} }
            {{- end }}
            - { name: MCP_SESSION_IDLE_TTL_SECONDS, value: {{ .Values.server.sessionIdleTtlSeconds | quote }} }
            - { name: MCP_IDENTITY_IDLE_TTL_SECONDS, value: {{ .Values.server.identityIdleTtlSeconds | quote }} }
            - { name: LOG_LEVEL,          value: {{ .Values.server.logLevel | quote }} }
            - { name: WRITE_AUDIT_NOTE,   value: {{ .Values.server.writeAuditNote | quote }} }
            - { name: IVANTI_BASE_URL,    value: {{ .Values.ivanti.baseUrl | quote }} }
            - { name: IVANTI_API_KEY_FILE, value: "{{ .Values.secrets.mountPath }}/ivanti-api-key" }
            {{- if .Values.ivanti.maxTier }}
            - { name: IVANTI_MAX_TIER,    value: {{ .Values.ivanti.maxTier | quote }} }
            {{- end }}
            {{- if include "ivanti-mcp.isSet" .Values.ivanti.timeoutMs }}
            - { name: IVANTI_TIMEOUT_MS,  value: {{ .Values.ivanti.timeoutMs | quote }} }
            {{- end }}
            {{- if include "ivanti-mcp.isSet" .Values.ivanti.writeTimeoutMs }}
            - { name: IVANTI_WRITE_TIMEOUT_MS, value: {{ .Values.ivanti.writeTimeoutMs | quote }} }
            {{- end }}
            {{- if include "ivanti-mcp.isSet" .Values.ivanti.maxConcurrentRequests }}
            - { name: IVANTI_MAX_CONCURRENT_REQUESTS, value: {{ .Values.ivanti.maxConcurrentRequests | quote }} }
            {{- end }}
            {{- with .Values.ivanti.configUrl }}
            - { name: IVANTI_CONFIG_URL,  value: {{ . | quote }} }
            # Mounted as a file like the other keys: the environment is visible to `kubectl describe`.
            - { name: IVANTI_CENTRAL_CONFIG_API_KEY_FILE, value: "{{ $.Values.secrets.mountPath }}/ivanti-central-config-api-key" }
            {{- end }}
            {{- with .Values.ivanti.impersonationRole }}
            - { name: IVANTI_IMPERSONATION_ROLE, value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.ivanti.impersonationRequired }}
            - { name: IVANTI_IMPERSONATION_REQUIRED, value: "true" }
            {{- end }}
            {{- if eq .Values.server.authMode "bearer" }}
            - { name: BEARER_TOKEN_FILE,  value: "{{ .Values.secrets.mountPath }}/bearer-token" }
            {{- end }}
            {{- if eq .Values.server.mode "enduser" }}
            - { name: ENDUSER_BUSINESS_OBJECTS, value: {{ join "," .Values.server.enduser.businessObjects | quote }} }
            {{- if .Values.server.enduser.quickActions }}
            - { name: ENDUSER_QUICK_ACTIONS, value: {{ join "," .Values.server.enduser.quickActions | quote }} }
            {{- end }}
            {{- with .Values.server.enduser.role }}
            - { name: ENDUSER_ROLE,        value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- if eq .Values.server.authMode "oauth" }}
            - { name: OAUTH_ISSUER, value: {{ .Values.oauth.issuer | quote }} }
            {{- with .Values.oauth.audience }}
            # A string or a list: the server takes a comma-separated list, and `join` leaves a string as it is.
            - { name: OAUTH_AUDIENCE, value: {{ join "," (kindIs "slice" . | ternary . (list .)) | quote }} }
            {{- end }}
            {{- with .Values.oauth.jwksUri }}
            - { name: OAUTH_JWKS_URI, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.oauth.scopesSupported }}
            - { name: OAUTH_SCOPES_SUPPORTED, value: {{ join "," . | quote }} }
            {{- end }}
            {{- with .Values.oauth.requiredScopes }}
            - { name: OAUTH_REQUIRED_SCOPES, value: {{ join "," . | quote }} }
            {{- end }}
            {{- with .Values.oauth.identityClaim }}
            - { name: OAUTH_IDENTITY_CLAIM, value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.oauth.requireTyp }}
            - { name: OAUTH_REQUIRE_TYP, value: "true" }
            {{- end }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            # A listener of its own, reached through the -metrics Service only. Every
            # interface of the pod, as MCP_BIND: who reaches it is the NetworkPolicy's
            # and metrics.token's business, and the Ingress never names that Service.
            - { name: METRICS_ON,         value: "true" }
            - { name: METRICS_BIND,       value: "0.0.0.0" }
            - { name: METRICS_PORT,       value: {{ .Values.metrics.port | quote }} }
            {{- if .Values.metrics.token }}
            - { name: METRICS_TOKEN_FILE, value: "{{ .Values.secrets.mountPath }}/metrics-token" }
            {{- end }}
            {{- end }}
            # Licensing (design §9f). The key is a file like the others; the install ID is
            # not a secret, and the same on every render (see ivanti-mcp.installId).
            - { name: LICENSE_KEY_FILE,   value: "{{ .Values.secrets.mountPath }}/licence-key" }
            - { name: LICENSE_INSTALL_ID, value: {{ include "ivanti-mcp.installId" . | quote }} }
            {{- with .Values.license.hubUrl }}
            - { name: LICENSE_HUB_URL,    value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.license.keepState }}
            - { name: LICENSE_STATE_SECRET, value: {{ include "ivanti-mcp.licenceStateName" . | quote }} }
            {{- end }}
            {{- with .Values.extraEnv }}{{- toYaml . | nindent 12 }}{{- end }}
          volumeMounts:
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true
          # /health is unauthenticated and always 200 — alive, which is all startup and
          # liveness should ask: restarting the pod over a tenant outage fixes nothing.
          # Readiness asks /ready, which answers 503 while the tenant has not answered
          # two checks in a row, so the Service stops routing here until it does.
          # The image is distroless, so httpGet is the only option: no shell, no curl.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ include "ivanti-mcp.secretName" . }}
            defaultMode: 0400
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ivanti-mcp.serviceAccountName" . }}
  labels: {{- include "ivanti-mcp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Off for the account; the pod turns it on only to keep its licence token
# (license.keepState), and the account's Role reaches that one Secret and nothing else.
automountServiceAccountToken: false
{{- end }}
